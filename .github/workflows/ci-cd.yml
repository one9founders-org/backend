name: Django CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─────────────────────────────────────────────
  # 1. Lint + Format
  # ─────────────────────────────────────────────
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-lint-${{ hashFiles('requirements.txt') }}

      - name: Install lint tools
        run: pip install black isort flake8 bandit

      - name: Black
        run: black --check --diff api/ config/ tests/

      - name: isort
        run: isort --check-only --diff api/ config/ tests/

      - name: flake8
        run: flake8 api/ config/ tests/

      - name: bandit (security scan)
        run: bandit -r api/ -f json -o bandit-report.json || true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  # ─────────────────────────────────────────────
  # 2. Test
  # ─────────────────────────────────────────────
  test:
    needs: lint-and-format
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: one9testuser
          POSTGRES_PASSWORD: one9testpass
          POSTGRES_DB: test_one9founders
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-test-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set env vars
        run: |
          echo "SECRET_KEY=test-secret-key-for-ci"           >> $GITHUB_ENV
          echo "DEBUG=True"                                   >> $GITHUB_ENV
          echo "DATABASE_NAME=test_one9founders"              >> $GITHUB_ENV
          echo "DATABASE_USER=one9testuser"                   >> $GITHUB_ENV
          echo "DATABASE_PASSWORD=one9testpass"               >> $GITHUB_ENV
          echo "DATABASE_HOST=localhost"                      >> $GITHUB_ENV
          echo "DATABASE_PORT=5432"                           >> $GITHUB_ENV
          echo "OPENAI_API_KEY=test-key"                      >> $GITHUB_ENV
          echo "DJANGO_SETTINGS_MODULE=config.test_settings"  >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379/1"           >> $GITHUB_ENV

      # FIX: run makemigrations --check so missing migrations are caught in CI
      # Scope to project apps only (excludes third-party like django_summernote)
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run api rag_directory research_papers

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests with coverage
        run: pytest --cov=api --cov-report=xml --cov-report=html

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests

  # ─────────────────────────────────────────────
  # 3. Deploy  (main branch only)
  # ─────────────────────────────────────────────
  deploy:
    needs: [lint-and-format, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (Nuclear Cleanup)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune -a --force
          sudo docker system prune -af
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 900s
          script: |
            set -e
            cd /var/www/one9founders           
            git fetch origin main
            git reset --hard origin/main


            # Record git SHA for Sentry release tracking
            sed -i '/^GIT_SHA=/d' .env
            echo "GIT_SHA=$(git rev-parse --short HEAD)" >> .env

            # Needed by POST /internal/run-discovery/ (X-Trigger-Secret).
            # Generate before compose up so the new container sees it.
            if ! grep -qE '^DISCOVERY_TRIGGER_SECRET=.+' .env; then
              echo "DISCOVERY_TRIGGER_SECRET=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')" >> .env
              echo "Generated DISCOVERY_TRIGGER_SECRET on the server."
            fi
            if ! grep -qE '^TRANCO_DB_PATH=' .env; then
              echo "TRANCO_DB_PATH=/app/backend/data/tranco.sqlite3" >> .env
            fi

            # Rebuild and restart. Do not `docker system prune -af` first:
            # a hung SSH step after prune left the box with no images.
            docker compose down
            DOCKER_BUILDKIT=1 docker compose build --build-arg BUILDKIT_INLINE_CACHE=1 --progress=plain
            docker compose up -d

            # Run migrations
            docker compose exec -T web python manage.py migrate --noinput

            # Translate known non-English blurbs and flag the rest for review
            docker compose exec -T web python manage.py lint_tool_languages --fix

            # Collect static files
            docker compose exec -T web python manage.py collectstatic --noinput

            # FIX: Rebuild FAISS index and upload to S3, and refresh news — both
            # best-effort and detached (docker compose exec -d), NOT awaited.
            # The site is already live at this point (containers up, migrations run,
            # static collected). Encoding all ~26k tools takes far longer than this
            # SSH step's timeout, and previously OOM'd (exit 137) on this box — either
            # way, waiting on it here risked killing the whole SSH session (and thus
            # skipping the step after it) instead of just leaving a stale index/news
            # until the job's next successful run.
            docker compose exec -d web python manage.py build_faiss_index
            docker compose exec -d web python manage.py run_news_pipeline

            # Uncapped discovery in the background so new tools land overnight
            # without blocking this SSH session. Nightly cron keeps it going.
            if ! crontab -l 2>/dev/null | grep -q 'run_tool_discovery'; then
              (
                crontab -l 2>/dev/null || true
                echo '15 2 * * * cd /var/www/one9founders && docker compose exec -T web python manage.py run_tool_discovery >> /var/log/tool-discovery.log 2>&1'
              ) | crontab -
            fi
            docker compose exec -d web python manage.py run_tool_discovery

            echo "Deploy complete."
