name: One-shot overnight assess apply

# Temporary branch-only trigger. Do not merge to main.
on:
  push:
    branches: [cursor/run-assess-apply-86bc]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Inspect idle, then start detached assess --apply
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script_path: scripts/run_assess_apply_once.sh
