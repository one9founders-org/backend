name: Run full HN catalog publish

# Push-triggered (no workflow_dispatch) so the cloud agent token can start it.
on:
  push:
    paths:
      - "scripts/run_hn_catalog_full.flag"
    branches:
      - main
      - "cursor/hn-catalog-fetch-logs-e1c4"
      - "cursor/hn-catalog-lint-fix-deploy-e1c4"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start full HN catalogue publish on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 180s
          script: |
            set -e
            cd /var/www/one9founders
            echo "===== containers ====="
            docker compose ps
            echo "===== processes before (docker top) ====="
            docker compose top web || true
            echo "===== stop prior HN catalogue ====="
            # web image has no ps; match python discover_hn cmdlines only (never the
            # inspector bash that contains this string in its own argv).
            docker compose exec -T web bash -lc '
              self=$$
              for cmdline in /proc/[0-9]*/cmdline; do
                pid=$(basename "$(dirname "$cmdline")")
                [ "$pid" = "$self" ] && continue
                [ "$pid" = "$$" ] && continue
                line=$(tr "\0" " " < "$cmdline" 2>/dev/null || true)
                case "$line" in
                  *python*discover_hn_catalog*)
                    echo "killing pid=$pid $line"
                    kill "$pid" 2>/dev/null || true
                    ;;
                esac
              done
              sleep 2
              # Also stop leftover wrapper bash parents if python children are gone.
              for cmdline in /proc/[0-9]*/cmdline; do
                pid=$(basename "$(dirname "$cmdline")")
                [ "$pid" = "$self" ] && continue
                line=$(tr "\0" " " < "$cmdline" 2>/dev/null || true)
                case "$line" in
                  *bash*-lc*discover_hn_catalog*)
                    echo "killing wrapper pid=$pid"
                    kill "$pid" 2>/dev/null || true
                    ;;
                esac
              done
              sleep 1
            ' || true
            echo "===== truncate prior logs ====="
            docker compose exec -T web bash -lc '
              : > /app/backend/hn-catalog-dry-run.log
              : > /app/backend/hn-catalog-publish.log
            '
            echo "===== start detached dry-run then --max-new 5000 ====="
            # Use compose exec -d (same as deploy bootstrap). Backgrounding
            # inside a non-detached exec is killed when the SSH/exec session ends.
            docker compose exec -d web bash -lc '
              set -o pipefail
              export PYTHONUNBUFFERED=1
              cd /app/backend
              python manage.py discover_hn_catalog --dry-run >> /app/backend/hn-catalog-dry-run.log 2>&1
              echo DRY_RUN_EXIT=$? >> /app/backend/hn-catalog-dry-run.log
              python manage.py discover_hn_catalog --max-new 5000 >> /app/backend/hn-catalog-publish.log 2>&1
              echo PUBLISH_EXIT=$? >> /app/backend/hn-catalog-publish.log
            '
            sleep 5
            echo "===== processes after (docker top) ====="
            docker compose top web || true
            echo "===== /proc discover_hn match ====="
            docker compose exec -T web bash -lc '
              found=0
              for cmdline in /proc/[0-9]*/cmdline; do
                if tr "\0" " " < "$cmdline" 2>/dev/null | grep -q "discover_hn_catalog"; then
                  echo "RUNNING $(basename "$(dirname "$cmdline")") $(tr "\0" " " < "$cmdline")"
                  found=1
                fi
              done
              if [ "$found" = "0" ]; then
                echo "(no discover_hn_catalog cmdline in /proc)"
              fi
              echo "--- dry-run head ---"
              head -n 30 /app/backend/hn-catalog-dry-run.log 2>/dev/null || true
            '
            touch /var/www/one9founders/hn-catalog-bootstrapped-v3
            echo "Forced start of HN dry-run + full publish (--max-new 5000)"
