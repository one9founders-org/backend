name: Run tool discovery

on:
  workflow_dispatch:
    inputs:
      action:
        description: inspect logs only, start capped discovery, OSS catalogue, or HN catalogue
        required: true
        default: inspect-and-run
        type: choice
        options:
          - inspect
          - inspect-and-run
          - oss-catalog
          - hn-catalog

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect and optionally start discovery
        uses: appleboy/ssh-action@v1.2.0
        env:
          DISCOVERY_ACTION: ${{ github.event.inputs.action }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          # HN full-sweep dry-run can take >7m; allow headroom for scrape + start.
          timeout: 1800s
          command_timeout: 30m
          envs: DISCOVERY_ACTION
          script_path: scripts/inspect_and_run_discovery.sh
