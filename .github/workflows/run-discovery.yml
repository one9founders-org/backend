name: Run tool discovery

on:
  workflow_dispatch:
    inputs:
      action:
        description: inspect logs only, or inspect then start a new run
        required: true
        default: inspect-and-run
        type: choice
        options:
          - inspect
          - inspect-and-run

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect and optionally start discovery
        uses: appleboy/ssh-action@v1.2.0
        env:
          DISCOVERY_ACTION: ${{ github.event.inputs.action }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 300s
          envs: DISCOVERY_ACTION
          script_path: scripts/inspect_and_run_discovery.sh
